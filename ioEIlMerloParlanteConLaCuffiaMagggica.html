<!DOCTYPE html>
<html>
  <head>
    <title>il merlo parlante</title>
  </head>
  <body>
    <script>
      	let page = -1;
		let pages = [];
		read("./testo.txt").then((result) => {
			const text = result;
			const chars = 1173;
			const prevChars = 4405;
			const len = text.length;
			console.log(len);
		
		    for(let i = 0; i < Math.floor(len/chars); i++){
		    	pages.push(text.substring(i*chars, (i+1)*chars));
		    }
		    if(Math.floor(len/chars) != len/chars){
		        pages.push(text.substring(Math.floor(len/chars)*chars));
			}
			document.getElementById("carNum").innerHTML = `num. caratteri: ${len} (${(len/prevChars).toFixed(2)}x in più dell'ultimo testo)`;
		});
		function frwd(){
			    page+=2;
		        document.getElementById("leftPage").innerHTML = pages[page-1];
			    document.getElementById("leftPage").style.backgroundColor = "#efedde";
		        document.getElementById("rightPage").innerHTML = pages[page];
		        document.getElementById("bkwd").disabled = false;
				updatePageNum();
		}
		function bkwd(){
		        page-=2;
		        document.getElementById("leftPage").innerHTML = pages[page-1];
		        document.getElementById("rightPage").innerHTML = pages[page];
		        if(page == -1){
		          document.getElementById("bkwd").disabled = true;
		          document.getElementById("leftPage").innerHTML = "";
				  document.getElementById("leftPage").style.backgroundColor = "#FFFFFF";
		          document.getElementById("rightPage").innerHTML = "<img id=\"cover\" src=\"merloparlante.png\">"
		        }
				updatePageNum();
	    }
		async function read(file){
			try {
			    const response = await fetch(file);
			    
			    const text = await response.text();
				console.log(text);
				return text;
			} catch (error) {
			    console.log(error);
			}
		}
		function updatePageNum(){
			if(page > 0){
				document.getElementById("pagNum").innerHTML = `Pagina: ${page} e ${page+1}`;
			}
			else{
				document.getElementById("pagNum").innerHTML = `Pagina: copertina`;
			}
		}
    </script>
    <style>
      body {
        font-family: 'Courier New', monospace;
      }
      #leftPage {
        background-color: #ffffff;
        word-break: normal;
		white-space: pre-wrap;
        display: block;
        margin: auto;
        width: 397px;
        height: 562px;
        left: -100%;
        transform: translate(-50%, 0%);
      }
      #rightPage {
        background-color: #e6e3d1;
        word-break: normal;
		white-space: pre-wrap;
        display: block;
        margin: auto;
        width: 397px;
        height: 562px;
        left: 100%;
        transform: translate(50%, -100%);
      }
      #cover {
        display: block;
        width: 100%;
      }
      button {
		  transform: translate(4275%, -2500%);
	  }
	  #pagNum {
		text-align: center;
	  }
	  #carNum {
		text-align: center;
	  }
    </style>
    <h2>IO E IL MERLO PARLANTE CON LA CUFFIA MAGGGICA</h2>
	<p id="pagNum">Pagina: copertina</p>
	<p id="carNum">num. caratteri: tanti</p>
    <div id="leftPage"></div>
    <div id="rightPage"><img id="cover" src="merloparlante.png"></div>
    <button id="bkwd" onclick="bkwd()" disabled><</button>
    <button id="frwd" onclick="frwd()">></button>
  </body>
</html>
