<!DOCTYPE html>
<html>
  <head>
    <title>il merlo parlante</title>
  </head>
  <body>
    <script>
      	let page = -1;
		let pages = [];
		read("./testo.txt").then((result) => {
			const text = result;
			const chars = 1239;
			const len = text.length;
			console.log(len);
		
		    for(let i = 0; i < Math.floor(len/chars); i++){
		    	pages.push(text.substring(i*chars, (i+1)*chars));
		    }
		    if(Math.floor(len/chars) != len/chars){
		        pages.push(text.substring(Math.floor(len/chars)));
			}
		});
		function frwd(){
			    page++;
		        document.getElementById("leftPage").innerHTML = pages[page*2];
		        document.getElementById("rightPage").innerHTML = pages[page*2+1];
		        document.getElementById("bkwd").disabled = false;
		}
		function bkwd(){
		        page--;
		        document.getElementById("leftPage").innerHTML = pages[page*2+1];
		        document.getElementById("rightPage").innerHTML = pages[page*2+2];
		        if(page == -1){
		          document.getElementById("bkwd").disabled = true;
		          document.getElementById("leftPage").innerHTML = "";
		          document.getElementById("rightPage").innerHTML = "<img id=\"cover\" src=\"merloparlante.png\">"
		        }
	    }
		async function read(file){
			try {
			    const response = await fetch(file);
			    
			    const text = await response.text();
				console.log(text);
				return text;
			} catch (error) {
			    console.log(error);
			}
		}
    </script>
    <style>
      body {
        font-family: 'Courier New', monospace;
      }
      #leftPage {
        background-color: #efedde;
        word-wrap: break-word;
        display: block;
        margin: auto;
        width: 397px;
        height: 562px;
        left: -100%;
        transform: translate(-50%, 0%);
      }
      #rightPage {
        background-color: #e6e3d1;
        word-wrap: break-word;
        display: block;
        margin: auto;
        width: 397px;
        height: 562px;
        left: 100%;
        transform: translate(50%, -100%);
      }
      #cover {
        display: block;
        width: 100%;
      }
      #bkwd {
        transform: translate(4275%, -2500%);
      }
      #frwd {
        transform: translate(4275%, -2500%);
      }
    </style>
    <h1>TEST</h1>
    <div id="leftPage"></div>
    <div id="rightPage">
    <img id="cover" src="merloparlante.png">
    </div>
    <button id="bkwd" onclick="bkwd()" disabled><</button>
    <button id="frwd" onclick="frwd()">></button>
  </body>
</html>
