<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Discord Activity</title>
    
    <!-- Load the official Discord Embedded App SDK via jsDelivr CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <h1 style="color: white;">Hello from GitHub Pages!</h1>
    <p style="color: white;">If you can read this, your iframe is loading successfully!</p>

    <script>
        // CRITICAL FIX: Ensure the package lookup uses EXACT matching casing strings
        const discordSdk = new window.discordSdk.DiscordSDK({ 
            client_id: "YOUR_COPIED_APPLICATION_ID_HERE" // Change this to your real ID string!
        });

        async function setupDiscordActivity() {
            try {
                // Initialize the mandatory connection handshaking sequence
                await discordSdk.ready();
                console.log("Handshake complete!");
            } catch (error) {
                console.error("SDK initialization failed:", error);
            }
        }

        setupDiscordActivity();
    </script>
</body>
</html>
